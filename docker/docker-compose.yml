version: '3.8'

services:
  playwright-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ci
    container_name: playwright-tests
    environment:
      - TEST_ENV=${TEST_ENV:-dev}
      - HEADLESS=${HEADLESS:-true}
      - WORKERS=${WORKERS:-4}
      - BASE_URL=${BASE_URL:-https://example.com}
      - API_BASE_URL=${API_BASE_URL:-https://api.example.com}
    volumes:
      - ../test-results:/app/test-results
      - ../allure-results:/app/allure-results
      - ../allure-report:/app/allure-report
      - ../playwright-report:/app/playwright-report
      - ../logs:/app/logs
    networks:
      - test-network

  playwright-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: playwright-dev
    environment:
      - TEST_ENV=${TEST_ENV:-dev}
      - HEADLESS=${HEADLESS:-false}
    volumes:
      - ..:/app
      - /app/node_modules
    networks:
      - test-network
    stdin_open: true
    tty: true

  allure-report-server:
    image: frankescobar/allure-docker-service:latest
    container_name: allure-reports
    ports:
      - "5050:5050"
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 1
    volumes:
      - ../allure-results:/app/allure-results
      - ../allure-report:/app/default-reports
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
